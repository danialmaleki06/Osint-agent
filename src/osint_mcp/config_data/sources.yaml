# ─────────────────────────────────────────────────────────────────────
# Каталог подключаемых источников и сигналов (Source Catalog / Library)
#
# Разделение источников:
# 1. Реестровые первичные источники (DaData, Checko, ЕГРЮЛ, ФССП, Федресурс,
#    ФГИС Росаккредитация, Реестр ПО Минцифры) захардкожены в ядре и дают
#    детерминированные факты высшего доверия (trust: registry).
#
# 2. Подключаемые источники из этого файла (Source Catalog) расширяют
#    систему: санкционные списки, кадровые порталы, проверка сайта компании,
#    внутренние политики/культура, специализированные реестры.
#
# scope:
#   global        — Единый реестр / датасет / общий API на ВСЕ компании.
#                   При проверке 100 компаний опрашивается ОДИН РАЗ (батч или локальный индекс),
#                   а не 100 отдельных веб-поисков!
#   company_asset — Локальный источник (сайт или HR-страница конкретной компании).
#                   Ищет адресно только на ресурсах проверяемого субъекта.
#
# Структура источника:
#   scope:           global | company_asset
#   topic:           Тема проверки (sanctions, company_culture, hr_stack, etc.)
#   type:            dataset_table | curated_domains | site_inspection | api_gateway
#   trust:           Базовое доверие: registry | reference | mention
#   description:     Человекочитаемое описание источника
#   produces_kind:   Вид факта (ExtFact.kind), который попадает в шину фактов
#   domains:         Доверенные домены для тематического поиска
#   search_template: Шаблон запроса при тематическом поиске
#   keywords:        Ключевые слова и маркеры для поиска сигналов
# ─────────────────────────────────────────────────────────────────────

sources:
  international_sanctions:
    scope: global
    topic: sanctions
    type: official_sanctions
    trust: reference
    description: "Сверка по ИНН РФ с официальными списками OFAC SDN, OFAC Non-SDN и ЕС"
    produces_kind: international_sanction

  rospotrebnadzor_plan:
    scope: global
    topic: inspections
    type: official_erknm_plan
    trust: reference
    description: "Плановые мероприятия Роспотребнадзора по 248-ФЗ, официальный годовой архив ЕРКНМ"
    produces_kind: rospotrebnadzor_inspection

  rospotrebnadzor_inspections:
    scope: global
    topic: inspections
    type: official_erknm_month
    trust: reference
    description: "Мероприятия Роспотребнадзора по 248-ФЗ, официальный архив ЕРКНМ за текущий месяц"
    produces_kind: rospotrebnadzor_inspection

  office_environment:
    scope: company_asset
    topic: company_culture
    type: site_inspection
    trust: mention
    description: "Внутренний распорядок, правила офиса и корпоративная культура конкретной компании"
    produces_kind: office_environment_signal
    search_template: '"{name}" ("в офисе" OR "культура" OR "офисный" OR "животные" OR "собака")'
    keywords:
      - "собака в офисе"
      - "dog friendly"
      - "дог-френдли"
      - "питомцы в офисе"
      - "животные в офисе"
      - "офисный пес"
      - "офисный кот"

  tech_stack_requirements:
    scope: company_asset
    topic: hr_stack
    type: curated_domains
    trust: reference
    description: "Технологический стек, используемое ПО и требования в вакансиях (HH, Habr)"
    produces_kind: tech_stack_signal
    domains:
      - "hh.ru"
      - "career.habr.com"
      - "superjob.ru"
    search_template: 'site:{domain} "{name}" ("стек" OR "знание" OR "опыт работы")'
    keywords:
      - "1с"
      - "bitrix"
      - "postgresql"
      - "python"
      - "kubernetes"
      - "linux"

  employee_reviews_salary:
    scope: company_asset
    topic: hr_reviews
    type: curated_domains
    trust: mention
    description: "Отзывы бывших и текущих сотрудников — сигналы задержек зарплаты и кассовых разрывов"
    produces_kind: employee_salary_signal
    domains:
      - "dreamjob.ru"
      - "pravda-sotrudnikov.ru"
      - "neorabote.net"
    search_template: 'site:{domain} "{name}" ("задержка зарплаты" OR "не платят" OR "серая зарплата")'
    keywords:
      - "задержка зарплаты"
      - "не платят зарплату"
      - "долги по зарплате"
      - "задержки зп"

  shared_web_analytics:
    scope: company_asset
    topic: digital_footprint
    type: site_inspection
    trust: reference
    description: "Обратный поиск по счетчикам веб-аналитики (Яндекс.Метрика, Google Analytics) для выявления скрытых холдингов и сетей сайтов"
    produces_kind: affiliate_domain_signal
    search_template: '"{tracker_id}" ("metrika" OR "google-analytics") -site:{domain}'
    keywords:
      - "metrika"
      - "analytics"
      - "ym"
      - "ga"

  customs_ved_trade:
    scope: company_asset
    topic: customs_ved
    type: curated_domains
    trust: reference
    description: "Таможенные декларации и внешнеэкономическая деятельность (импорт/экспорт, цепочки поставок, санкционные риски)"
    produces_kind: customs_trade_signal
    domains:
      - "customs.gov.ru"
      - "stat.customs.gov.ru"
      - "importgenius.com"
      - "statimex.ru"
    search_template: '"{inn}" ("декларация" OR "импорт" OR "экспорт" OR "ГТД" OR "ВЭД")'
    keywords:
      - "таможенная декларация"
      - "импортные поставки"
      - "экспорт"
      - "ГТД"

  geo_maps_reviews:
    scope: company_asset
    topic: geo_reality
    type: curated_domains
    trust: mention
    description: "Картографический OSINT (Яндекс.Карты, 2ГИС): физическая реальность адреса и семантика свежих отзывов"
    produces_kind: operational_issue_signal
    domains:
      - "yandex.ru"
      - "2gis.ru"
    search_template: '"{name}" ("отзывы" OR "карты" OR "панорамы")'
    keywords:
      - "отзывы"
      - "яндекс карты"
      - "2gis"
      - "жалоба"
      - "задержка"
