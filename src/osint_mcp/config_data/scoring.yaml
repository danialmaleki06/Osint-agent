# ─────────────────────────────────────────────────────────────────────
# Скоринг: критерии, веса, вердикты.
#
# Этот файл — единственный источник бизнес-логики оценки контрагента.
# Движок скоринга (engine.py) определяет КАК производить вычисления,
# а ЧТО и с какими весами оценивать — задано здесь.
#
# Структура критерия:
#   group        — группа из секции groups, веса групп нормируются на 100.
#   description  — экономическое и правовое описание риск-фактора.
#   match        — фильтр фактов: kind, field, op (contains_any | eq | gt | lt | exists).
#   aggregate    — агрегация: count | sum | max | age_days.
#   field        — числовое поле payload для sum/max.
#   thresholds   — ступенчатая шкала: above / below со своими баллами и метками.
#   score        — базовый вес критерия:
#                  - Отрицательные баллы применяются к итогу на 100% (не размываются).
#                  - Положительные баллы масштабируются весом группы (score * group_weight / 100).
#   decay        — полураспад (half_life_days) затухания актуальности событий по времени.
#   verdict_floor— жесткий пол вердикта: режет итоговую оценку сверху независимо от суммы.
#   warn_always  — всегда выносить сработавший критерий в блок критических предупреждений.
#   reason       — шаблон обоснования для итогового заключения.
# ─────────────────────────────────────────────────────────────────────

# Базовый балл благонадежности нейтрального контрагента без сработавших факторов.
baseline: 60

# Веса групп нормируются на 100.
# Определяют долю влияния положительных факторов группы на итоговый балл.
groups:
  registry_risk:
    weight: 40    # Правоспособность, санкции, банкротство, ЕГРЮЛ
  litigation:
    weight: 25    # Исполнительные производства ФССП, арбитражные суды, уголовные риски
  finance:
    weight: 25    # Капитал, налоговая нагрузка, возраст, ВЭД, активы Федресурса
  person:
    weight: 10    # Руководство, номиналы, токсичные связи, цифровые холдинги

# ── Критерии оценки (откалиброванная модель ключевых комплаенс-факторов) ───

criteria:

  # ═════════════════════════════════════════════════════════════════════
  # 1. ГРУППА REGISTRY_RISK: Правоспособность и достоверность сведений
  # ═════════════════════════════════════════════════════════════════════

  liquidated:
    group: registry_risk
    description: "Организация ликвидирована, прекратила деятельность или в процессе ликвидации/реорганизации"
    match:
      kind: registry_flag
      field: status
      op: contains_any
      values: ["ликвид", "прекращ", "реорганиз"]
    score: -100
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Организация не действует: {statement}"

  bankruptcy:
    group: registry_risk
    description: "Сообщения в едином реестре банкротств (ЕФРСБ)"
    match:
      kind: bankruptcy
    score: -90
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Процедура банкротства: {statement}"

  international_sanctions_hit:
    group: registry_risk
    description: "Включение в международные санкционные списки (OFAC SDN / EU / UK)"
    match:
      kind: international_sanction
      op: exists
    score: -90
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Международные санкции: {statement}"

  sanctioned:
    group: registry_risk
    description: "Санкционные списки РФ и реестры нелегальной финансовой деятельности ЦБ РФ"
    match:
      kind: registry_flag
      field: flag
      op: contains_any
      values: ["Санкции", "СанкцУчр", "НелегалФин"]
    score: -85
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Санкционные/финансовые отметки: {statement}"

  unfair_supplier:
    group: registry_risk
    description: "Включение в Реестр недобросовестных поставщиков ФАС (РНП по 44-ФЗ / 223-ФЗ)"
    match:
      kind: registry_flag
      field: flag
      op: contains_any
      values: ["НедобПост"]
    score: -50
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Компания в реестре недобросовестных поставщиков"

  query_name_mismatch:
    group: registry_risk
    description: "Запрошенное наименование контрагента не совпадает с данными по ИНН в ЕГРЮЛ (риск подмены)"
    match:
      kind: registry
      field: критичность
      op: eq
      values: ["high"]
    score: -40
    warn_always: true
    verdict_floor: "рискованно"
    reason: "{statement}"

  suspicious_physical_address:
    group: registry_risk
    description: "Подозрительный физический адрес на картах/панорамах (гаражный кооператив, пустырь, барак)"
    match:
      kind: suspicious_address_signal
      op: exists
    score: -35
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Физическая реальность адреса: {statement}"

  office_environment_risk:
    group: registry_risk
    description: "Критический стоп-фактор политик безопасности и регламентов офиса"
    match:
      kind: office_environment_signal
      op: exists
    score: -100
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Критический стоп-фактор офисной политики: {statement}"

  planned_inspections:
    group: registry_risk
    description: "Назначенные плановые проверки в едином реестре ЕРКНМ (информационный след)"
    match:
      kind: planned_inspection
    aggregate: count
    thresholds:
      - { above: 0, score: 0, label: "плановая проверка надзорного органа" }
    warn_always: false
    reason: "{label} ({count})"


  # ═════════════════════════════════════════════════════════════════════
  # 2. ГРУППА LITIGATION: Судебная нагрузка, ФССП и дефолты
  # ═════════════════════════════════════════════════════════════════════

  enforcement_debt:
    group: litigation
    description: "Принудительное взыскание долгов через судебных приставов (ФССП)"
    match:
      kind: enforcement
      field: amount
    aggregate: sum
    field: amount
    relative_to: revenue
    relative_thresholds:
      - { above: 0.15, score: -35, warn: true,  label: "критический долг ФССП (>15% годовой выручки)" }
      - { above: 0.05, score: -20, warn: true,  label: "существенный долг ФССП (>5% годовой выручки)" }
      - { above: 0.01, score: -8,  warn: false, label: "умеренный долг ФССП (>1% годовой выручки)" }
      - { above: 0.00, score: -1,  warn: false, label: "незначительный долг ФССП (<1% годовой выручки)" }
    thresholds:
      - { above: 10000000, score: -35, warn: true }
      - { above: 1000000,  score: -20, warn: true }
      - { above: 100000,   score: -8,  warn: false }
      - { above: 0,        score: -3,  warn: false }
    decay:
      half_life_days: 365
    warn_always: true
    reason: "Долги ФССП: {sum} ₽{ratio_info} по {count} производствам"

  defendant_cases:
    group: litigation
    description: "Арбитражные дела, где компания выступает ответчиком (судебные претензии)"
    match:
      kind: arbitration
      field: role
      op: eq
      values: ["ответчик"]
    aggregate: count
    field: amount
    relative_to: revenue
    relative_thresholds:
      - { above: 0.15, score: -30, warn: true,  label: "критический объем исков (>15% годовой выручки)" }
      - { above: 0.05, score: -15, warn: true,  label: "существенный объем исков (>5% годовой выручки)" }
      - { above: 0.01, score: -6,  warn: false, label: "умеренный объем исков (>1% годовой выручки)" }
      - { above: 0.00, score: -1,  warn: false, label: "незначительный объем исков (<1% годовой выручки)" }
    thresholds:
      - { above: 20, score: -25, warn: true }
      - { above: 5,  score: -12, warn: true }
      - { above: 0,  score: -5,  warn: false }
    decay:
      half_life_days: 730
    warn_always: true
    reason: "Ответчик в {count} арбитражных делах{ratio_info}"

  reputation_fiasco_criminal_investigation:
    group: litigation
    description: "Уголовные дела, обыски, следственные действия или аресты руководства"
    match:
      kind: fiasco_criminal_investigation
      op: exists
    score: -45
    warn_always: true
    verdict_floor: "не рекомендуется"
    reason: "Уголовные и следственные риски: {statement}"

  reputation_fiasco_payment_default:
    group: litigation
    description: "Публично подтвержденные неплатежи подрядчикам, удержание средств или затягивание актов"
    match:
      kind: fiasco_payment_default
      op: exists
    score: -30
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Коммерческий риск неплатежей/споров с подрядчиками: {statement}"


  # ═════════════════════════════════════════════════════════════════════
  # 3. ГРУППА FINANCE: Финансовое здоровье, активы и коммерческий оборот
  # ═════════════════════════════════════════════════════════════════════

  negative_net_assets_risk:
    group: finance
    description: "Отрицательные чистые активы (ст. 20 14-ФЗ) — дефицит собственного капитала"
    match:
      kind: negative_net_assets
      op: exists
    score: -40
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Отрицательный собственный капитал: {statement}"

  tax_debt_scale_risk:
    group: finance
    description: "Налоговая недоимка несоразмерна прибыли (>50% прибыли, риск блокировки по ст. 76 НК РФ)"
    match:
      kind: tax_debt_scale_risk
      op: exists
    score: -25
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Налоговая задолженность: {statement}"

  company_age:
    group: finance
    description: "Возраст компании и подтвержденная длительность работы на рынке"
    match:
      kind: registry
    aggregate: age_days
    thresholds:
      - { above: 3650, score: 20, label: "10+ лет на рынке" }
      - { above: 1825, score: 10, label: "5+ лет на рынке" }
      - { below: 365,  score: -10, label: "молодая компания, меньше года" }
    reason: "{label}"

  customs_trade_activity:
    group: finance
    description: "Подтвержден реальный физический товарооборот ВЭД (импорт/экспорт)"
    match:
      kind: customs_trade_signal
      op: exists
    score: 16
    warn_always: false
    reason: "ВЭД и таможенные операции: {statement}"

  leasing_activity:
    group: finance
    description: "Действующие договоры лизинга (Федресурс) — наличие техники и производственных мощностей"
    match:
      kind: leasing
    aggregate: count
    thresholds:
      - { above: 4, score: 8, label: "активный лизинг — парк техники растет" }
      - { above: 0, score: 4, label: "техника в лизинге" }
    decay:
      half_life_days: 1095
    warn_always: false
    reason: "{label} ({count} публикаций)"

  pledge_activity:
    group: finance
    description: "Залоги движимого имущества (Федресурс) — кредитная история под обеспечение активами"
    match:
      kind: pledge
    aggregate: count
    thresholds:
      - { above: 2, score: 6, label: "кредитная история с обеспечением залогами" }
      - { above: 0, score: 2, label: "залог оборудования/активов" }
    decay:
      half_life_days: 1095
    warn_always: false
    reason: "{label} ({count} публикаций)"

  factoring_usage:
    group: finance
    description: "Регулярный факторинг дебиторской задолженности (Федресурс) — финансирование кассовых разрывов"
    match:
      kind: factoring
    aggregate: count
    thresholds:
      - { above: 2, score: -4, label: "регулярный факторинг — финансирование кассовых разрывов" }
      - { above: 0, score: -2, label: "факторинг дебиторской задолженности" }
    decay:
      half_life_days: 730
    warn_always: false
    reason: "{label} ({count} публикаций)"

  sro_membership:
    group: finance
    description: "Членство в СРО (Федресурс) — официальный допуск к строительным и проектировочным работам"
    match:
      kind: sro_membership
    aggregate: count
    thresholds:
      - { above: 0, score: 4, label: "член СРО" }
    decay:
      half_life_days: 1825
    warn_always: false
    reason: "{label} ({count} публикаций)"

  fsa_active_certificate:
    group: finance
    description: "Действующие сертификаты и декларации Росаккредитации (ФСА) — легальный товарный оборот"
    match:
      kind: fsa_certificate
      field: end_date
      op: exists
    aggregate: count
    thresholds:
      - { above: 4, score: 4, label: "портфель подтвержденной продукции" }
      - { above: 0, score: 2, label: "действующие документы соответствия" }
    warn_always: false
    reason: "{label} ({count})"

  trademarks_registered:
    group: finance
    description: "Зарегистрированные товарные знаки (Роспатент / ФИПС) — капитализация нематериальных активов"
    match:
      kind: trademark
    aggregate: count
    thresholds:
      - { above: 2, score: 6, label: "портфель товарных знаков" }
      - { above: 0, score: 2, label: "зарегистрирован товарный знак" }
    warn_always: false
    reason: "{label} ({count})"

  russian_software_registered:
    group: finance
    description: "Продукты в реестре отечественного ПО Минцифры — аккредитованные IT-разработки"
    match:
      kind: software_registry
    aggregate: count
    thresholds:
      - { above: 1, score: 8, label: "несколько продуктов в реестре российского ПО" }
      - { above: 0, score: 4, label: "продукт в реестре российского ПО Минцифры" }
    warn_always: false
    reason: "{label} ({count})"


  # ═════════════════════════════════════════════════════════════════════
  # 4. ГРУППА PERSON: Руководство, аффилированность и структура владения
  # ═════════════════════════════════════════════════════════════════════

  mass_management:
    group: person
    description: "Массовый руководитель, учредитель или дисквалифицированные лица в руководстве"
    match:
      kind: registry_flag
      field: flag
      op: contains_any
      values: ["МассРуковод", "МассУчред", "ДисквЛица"]
    score: -30
    warn_always: true
    verdict_floor: "рискованно"
    reason: "Признаки ненадежного руководства: {statement}"

  suspicious_affiliates:
    group: person
    description: "Наличие ликвидированных или проблемных связанных организаций в аффилированной сети"
    match:
      kind: registry_flag
      field: link
      op: exists
    aggregate: count
    thresholds:
      - { above: 3, score: -20 }
      - { above: 0, score: -8 }
    warn_always: true
    reason: "{count} подозрительных связей в аффилированной сети"

  affiliate_network_detected:
    group: person
    description: "Обнаружена связанная сеть сайтов / холдинговая группа по единым счетчикам веб-аналитики"
    match:
      kind: affiliate_domain_signal
      op: exists
    score: 10
    warn_always: false
    reason: "Цифровая аффилированность / скрытый холдинг: {statement}"


# ── Шкала вердиктов ─────────────────────────────────────────────────
# Проверяется сверху вниз: срабатывает первая строка, где total >= min
# (или total <= max для отрицательных зон риска).
verdicts:
  - { min: 75,  label: "отлично" }
  - { min: 50,  label: "хорошо" }
  - { min: 0,   label: "удовлетворительно", require_reason: false }
  - { max: -1,  label: "рискованно", require_reason: true }
  - { max: -60, label: "не рекомендуется", require_reason: true }
